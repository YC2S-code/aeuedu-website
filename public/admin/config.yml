backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

i18n:
  structure: multiple_folders
  locales: [en, zh]
  default_locale: en

collections:
  - name: settings
    label: Site Settings
    files:
      - name: site_en
        label: "General Settings (English)"
        file: src/content/settings/en/site.yml
        fields:
          - { label: Site Name, name: siteName, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - label: Navigation Labels
            name: nav
            widget: object
            fields:
              - { label: Contact, name: contact, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Address, name: address, widget: string }
              - { label: Phone, name: phone, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Google Map Embed URL, name: mapEmbedUrl, widget: string, required: false, hint: "Paste the 'src' from a Google Maps embed iframe" }
              - { label: Facebook URL, name: facebook, widget: string, required: false }
              - { label: YouTube URL, name: youtube, widget: string, required: false }
              - { label: TikTok URL, name: tiktok, widget: string, required: false }
              - { label: WeChat ID, name: wechat, widget: string, required: false }
              - { label: WeChat QR Code, name: wechatQr, widget: image, required: false, hint: "Upload the official account QR code so visitors can scan to follow on WeChat" }
              - { label: Copyright Text, name: copyright, widget: string }
              - { label: Disclaimer, name: disclaimer, widget: text, required: false }
          - label: Homepage
            name: home
            widget: object
            fields:
              - { label: Hero Title, name: heroTitle, widget: string }
              - { label: Hero Subtitle, name: heroSubtitle, widget: markdown, buttons: [bold, italic, link], minimal: true }
              - { label: Hero Image, name: heroImage, widget: image, required: false }
              - { label: Hero Button Text, name: heroCta, widget: string }
              - { label: "\"Why Choose Us\" Section Title", name: highlightsTitle, widget: string }
              - label: "\"Why Choose Us\" Cards"
                name: highlights
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: markdown, buttons: [bold, italic, link], minimal: true }
          - label: Page Banners
            name: banners
            widget: object
            fields:
              - { label: News Page Banner Image, name: news, widget: image, required: false }
              - { label: Events Page Banner Image, name: events, widget: image, required: false }

      - name: site_zh
        label: "General Settings (中文)"
        file: src/content/settings/zh/site.yml
        fields:
          - { label: Site Name, name: siteName, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - label: Navigation Labels
            name: nav
            widget: object
            fields:
              - { label: Contact, name: contact, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Address, name: address, widget: string }
              - { label: Phone, name: phone, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Google Map Embed URL, name: mapEmbedUrl, widget: string, required: false, hint: "Paste the 'src' from a Google Maps embed iframe" }
              - { label: Facebook URL, name: facebook, widget: string, required: false }
              - { label: YouTube URL, name: youtube, widget: string, required: false }
              - { label: TikTok URL, name: tiktok, widget: string, required: false }
              - { label: WeChat ID, name: wechat, widget: string, required: false }
              - { label: WeChat QR Code, name: wechatQr, widget: image, required: false, hint: "Upload the official account QR code so visitors can scan to follow on WeChat" }
              - { label: Copyright Text, name: copyright, widget: string }
              - { label: Disclaimer, name: disclaimer, widget: text, required: false }
          - label: Homepage
            name: home
            widget: object
            fields:
              - { label: Hero Title, name: heroTitle, widget: string }
              - { label: Hero Subtitle, name: heroSubtitle, widget: markdown, buttons: [bold, italic, link], minimal: true }
              - { label: Hero Image, name: heroImage, widget: image, required: false }
              - { label: Hero Button Text, name: heroCta, widget: string }
              - { label: "\"Why Choose Us\" Section Title", name: highlightsTitle, widget: string }
              - label: "\"Why Choose Us\" Cards"
                name: highlights
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: markdown, buttons: [bold, italic, link], minimal: true }
          - label: Page Banners
            name: banners
            widget: object
            fields:
              - { label: News Page Banner Image, name: news, widget: image, required: false }
              - { label: Events Page Banner Image, name: events, widget: image, required: false }

  - name: pages
    label: Site Pages
    folder: src/content/pages
    create: false
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Banner Image, name: image, widget: image, required: false, hint: "Background image for the page header banner" }
      - { label: Body, name: body, widget: markdown, i18n: true }

  - name: news
    label: News
    folder: src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    i18n: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Date, name: date, widget: datetime, i18n: duplicate }
      - { label: Image, name: image, widget: image, required: false, i18n: true }
      - { label: Summary, name: summary, widget: markdown, buttons: [bold, italic, link], minimal: true, i18n: true }
      - { label: "Video URL", name: video, widget: string, required: false, i18n: true, hint: "Paste a video link to embed on the article page. For English pages, YouTube/Vimeo work well. For Chinese pages, use Bilibili (or a self-hosted MP4 link) since YouTube/Vimeo are blocked in mainland China." }
      - { label: Body, name: body, widget: markdown, i18n: true }

  - name: events
    label: Events
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Date, name: date, widget: datetime, i18n: duplicate }
      - { label: End Date, name: endDate, widget: datetime, required: false, i18n: duplicate }
      - { label: Location, name: location, widget: string, required: false, i18n: true }
      - { label: Image, name: image, widget: image, required: false, i18n: true }
      - { label: Summary, name: summary, widget: markdown, buttons: [bold, italic, link], minimal: true, i18n: true }
      - { label: Body, name: body, widget: markdown, i18n: true }
