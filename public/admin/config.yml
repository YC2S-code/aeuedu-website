backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

i18n:
  structure: multiple_folders
  locales: [en, zh]
  default_locale: en

collections:
  - name: settings
    label: "Site Settings / 网站设置"
    files:
      - name: site_en
        label: "🇬🇧 English Settings (EN)"
        file: src/content/settings/en/site.yml
        fields:
          - { label: "Site Name", name: siteName, widget: string }
          - { label: "Tagline", name: tagline, widget: string }
          - label: "Navigation Labels"
            name: nav
            widget: object
            fields:
              - { label: "Contact", name: contact, widget: string }
          - label: "Footer"
            name: footer
            widget: object
            fields:
              - { label: "Address", name: address, widget: string }
              - { label: "Phone", name: phone, widget: string }
              - { label: "Email", name: email, widget: string }
              - { label: "Google Map Embed URL (optional)", name: mapEmbedUrl, widget: string, required: false, hint: "Paste the 'src' from a Google Maps embed iframe" }
              - { label: "Facebook URL (optional)", name: facebook, widget: string, required: false }
              - { label: "YouTube URL (optional)", name: youtube, widget: string, required: false }
              - { label: "TikTok URL (optional)", name: tiktok, widget: string, required: false }
              - { label: "WeChat ID (optional)", name: wechat, widget: string, required: false }
              - { label: "WeChat QR Code (optional)", name: wechatQr, widget: image, required: false, hint: "Upload the official account QR code" }
              - { label: "Copyright Text", name: copyright, widget: string }
              - { label: "Disclaimer (optional)", name: disclaimer, widget: text, required: false }
          - label: "Homepage"
            name: home
            widget: object
            fields:
              - { label: "Hero Title", name: heroTitle, widget: string }
              - { label: "Hero Subtitle", name: heroSubtitle, widget: markdown, buttons: [bold, italic, link], minimal: true }
              - { label: "Hero Image (optional)", name: heroImage, widget: image, required: false }
              - { label: "Hero Button Text", name: heroCta, widget: string }
              - { label: "Highlights Section Title", name: highlightsTitle, widget: string }
              - label: "Highlight Cards"
                name: highlights
                widget: list
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Text", name: text, widget: markdown, buttons: [bold, italic, link], minimal: true }
          - label: "Page Banners"
            name: banners
            widget: object
            required: false
            fields:
              - { label: "News Page Banner Image (optional)", name: news, widget: image, required: false }
              - { label: "Events Page Banner Image (optional)", name: events, widget: image, required: false }

      - name: site_zh
        label: "🇨🇳 中文设置 (ZH)"
        file: src/content/settings/zh/site.yml
        fields:
          - { label: "网站名称 Site Name", name: siteName, widget: string }
          - { label: "标语 Tagline", name: tagline, widget: string }
          - label: "导航标签 Navigation Labels"
            name: nav
            widget: object
            fields:
              - { label: "联系 Contact", name: contact, widget: string }
          - label: "页脚 Footer"
            name: footer
            widget: object
            fields:
              - { label: "地址 Address", name: address, widget: string }
              - { label: "电话 Phone", name: phone, widget: string }
              - { label: "邮箱 Email", name: email, widget: string }
              - { label: "谷歌地图嵌入链接 Google Map URL（选填）", name: mapEmbedUrl, widget: string, required: false, hint: "从谷歌地图 iframe 中复制 src 链接" }
              - { label: "Facebook链接（选填）", name: facebook, widget: string, required: false }
              - { label: "YouTube链接（选填）", name: youtube, widget: string, required: false }
              - { label: "TikTok链接（选填）", name: tiktok, widget: string, required: false }
              - { label: "微信号（选填）", name: wechat, widget: string, required: false }
              - { label: "微信二维码（选填）", name: wechatQr, widget: image, required: false, hint: "上传官方账号二维码，供访客扫码关注" }
              - { label: "版权信息 Copyright", name: copyright, widget: string }
              - { label: "免责声明（选填）Disclaimer", name: disclaimer, widget: text, required: false }
          - label: "首页 Homepage"
            name: home
            widget: object
            fields:
              - { label: "主标题 Hero Title", name: heroTitle, widget: string }
              - { label: "副标题 Hero Subtitle", name: heroSubtitle, widget: markdown, buttons: [bold, italic, link], minimal: true }
              - { label: "主图背景 Hero Image（选填）", name: heroImage, widget: image, required: false }
              - { label: "按钮文字 Button Text", name: heroCta, widget: string }
              - { label: "推广台标题 Highlights Title", name: highlightsTitle, widget: string }
              - label: "推广台卡片 Highlight Cards"
                name: highlights
                widget: list
                fields:
                  - { label: "标题 Title", name: title, widget: string }
                  - { label: "内容 Text", name: text, widget: markdown, buttons: [bold, italic, link], minimal: true }
          - label: "页面横幅图 Page Banners"
            name: banners
            widget: object
            required: false
            fields:
              - { label: "新闻页横幅图（选填）", name: news, widget: image, required: false }
              - { label: "活动页横幅图（选填）", name: events, widget: image, required: false }

  - name: pages
    label: "Site Pages / 网站页面"
    folder: src/content/pages
    create: true
    slug: "{{slug}}"
    i18n: true
    summary: "{{title}} / {{titleZh}}"
    sortable_fields: ['title', 'parent']
    view_groups:
      - label: "Main Navigation Section / 主导航分类"
        field: parent
    fields:
      - { label: "Title / 标题 (English)", name: title, widget: string, i18n: true }
      - { label: "中文标题 (Chinese Title)", name: titleZh, widget: string, required: false, i18n: false, hint: "用于在管理页面列表中同时显示中英文标题。" }
      - label: "Show in Navigation Menu / 显示在导航菜单"
        name: parent
        widget: select
        required: false
        i18n: duplicate
        hint: "Choose which main menu this page should appear under. Leave empty to keep this page out of the navigation menu (it will still have its own page)."
        options:
          - { label: "Programs / 课程项目", value: programs }
          - { label: "Faculty & Consulting / 教授/企业咨询", value: faculty }
          - { label: "Alumni / 亚欧人", value: alumni }
          - { label: "Impact / 影响力", value: impact }
          - { label: "News & Events / 活动/新闻", value: news }
          - { label: "About AEU / 我的亚欧", value: about }
      - { label: "Navigation Label / 导航菜单文字", name: navLabel, widget: string, required: false, i18n: true, hint: "Short label shown in the navigation menu. If left empty, the page Title above is used." }
      - { label: "Banner Image / 横幅图", name: image, widget: image, required: false, hint: "Recommended size: 1920 x 600px (wide banner). Shown as the background of the page header. If left empty, the header shows as a plain title bar with no image." }
      - { label: "Body / 正文", name: body, widget: markdown, i18n: true }

  - name: news
    label: "News / 新闻与公告"
    folder: src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: "/images/uploads/news/{{slug}}"
    public_folder: "/images/uploads/news/{{slug}}"
    i18n: true
    fields:
      - { label: "Title / 标题", name: title, widget: string, i18n: true }
      - { label: "Date / 日期", name: date, widget: datetime, i18n: duplicate }
      - { label: "Banner Image / 横幅图", name: image, widget: image, required: true, i18n: true, hint: "Recommended size: 1200 x 675px (16:9). Used as the article banner, card thumbnail, and Feature News image on the homepage." }
      - label: "Category / 分类"
        name: category
        widget: select
        i18n: duplicate
        default: news
        options:
          - { label: "News / 新闻", value: news }
          - { label: "Announcement / 公告", value: announcement }
          - { label: "Event / 活动", value: event }
          - { label: "Alumni / 校友", value: alumni }
          - { label: "Article / 文章", value: article }
      - { label: 'Show in Homepage Feature News / 显示在首页"精选资讯"', name: featured, widget: boolean, required: false, default: false, i18n: duplicate, hint: "Up to 6 featured articles show on the homepage Feature News section, sorted by latest date if more than 6 are selected." }
      - { label: 'PINS Article / 置顶文章', name: pinned, widget: boolean, required: false, default: false, i18n: duplicate, hint: "Up to 2 pinned news/announcement articles show in the Pins section at the top of the homepage, above Feature News." }
      - { label: "Summary / 摘要", name: summary, widget: markdown, buttons: [bold, italic, link], minimal: true, i18n: true }
      - { label: "Video URL / 视频链接", name: video, widget: string, required: false, i18n: true, hint: "Paste a video link to embed on the article page. For English pages, YouTube/Vimeo work well. For Chinese pages, use Bilibili (or a self-hosted MP4 link) since YouTube/Vimeo are blocked in mainland China." }
      - { label: "Body / 正文", name: body, widget: markdown, i18n: true }

  - name: events
    label: "Events / 活动"
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    media_folder: "/images/uploads/events/{{slug}}"
    public_folder: "/images/uploads/events/{{slug}}"
    i18n: true
    fields:
      - { label: "Title / 标题", name: title, widget: string, i18n: true }
      - { label: "Date / 开始日期", name: date, widget: datetime, i18n: duplicate }
      - { label: "End Date / 结束日期", name: endDate, widget: datetime, required: false, i18n: duplicate }
      - { label: "Location / 地点", name: location, widget: string, required: false, i18n: true }
      - { label: "Banner Image / 横幅图", name: image, widget: image, required: true, i18n: true, hint: "Recommended size: 1200 x 675px (16:9). Used as the event banner, card thumbnail, and Upcoming Events image on the homepage." }
      - { label: "Category / 分类", name: category, widget: string, required: false, i18n: true }
      - { label: 'Show in Homepage Upcoming Events / 显示在首页"近期活动"', name: featured, widget: boolean, required: false, default: false, i18n: duplicate, hint: "Up to 4 featured events show on the homepage Upcoming Events section, sorted by soonest date if more than 4 are selected." }
      - { label: "Summary / 摘要", name: summary, widget: markdown, buttons: [bold, italic, link], minimal: true, i18n: true }
      - { label: "Body / 正文", name: body, widget: markdown, i18n: true }
