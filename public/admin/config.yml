backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

i18n:
  structure: multiple_folders
  locales: [en, zh]
  default_locale: en

collections:
  - name: settings
    label: Site Settings
    files:
      - name: site
        label: General Settings
        file: src/content/settings/site.yml
        i18n: true
        fields:
          - { label: Site Name, name: siteName, widget: string, i18n: true }
          - { label: Tagline, name: tagline, widget: string, i18n: true }
          - label: Navigation Labels
            name: nav
            widget: object
            i18n: true
            fields:
              - { label: Home, name: home, widget: string }
              - { label: About, name: about, widget: string }
              - { label: Admissions, name: admissions, widget: string }
              - { label: Programs, name: programs, widget: string }
              - { label: News, name: news, widget: string }
              - { label: Events, name: events, widget: string }
              - { label: Gallery, name: gallery, widget: string }
              - { label: Contact, name: contact, widget: string }
          - label: Footer
            name: footer
            widget: object
            i18n: true
            fields:
              - { label: Address, name: address, widget: string }
              - { label: Phone, name: phone, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Google Map Embed URL, name: mapEmbedUrl, widget: string, required: false, hint: "Paste the 'src' from a Google Maps embed iframe" }
              - { label: Facebook URL, name: facebook, widget: string, required: false }
              - { label: YouTube URL, name: youtube, widget: string, required: false }
              - { label: Copyright Text, name: copyright, widget: string }
          - label: Homepage
            name: home
            widget: object
            i18n: true
            fields:
              - { label: Hero Title, name: heroTitle, widget: string }
              - { label: Hero Subtitle, name: heroSubtitle, widget: text }
              - { label: Hero Image, name: heroImage, widget: image, required: false }
              - { label: Hero Button Text, name: heroCta, widget: string }
              - { label: "\"Why Choose Us\" Section Title", name: highlightsTitle, widget: string }

  - name: pages
    label: Site Pages
    files:
      - name: about-history-mission
        label: "About: History & Mission"
        file: src/content/pages/about-history-mission.md
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Body, name: body, widget: markdown, i18n: true }
      - name: about-leadership
        label: "About: Leadership"
        file: src/content/pages/about-leadership.md
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Body, name: body, widget: markdown, i18n: true }
      - name: about-facilities
        label: "About: Facilities"
        file: src/content/pages/about-facilities.md
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Body, name: body, widget: markdown, i18n: true }
      - name: admissions-process
        label: "Admissions: Process"
        file: src/content/pages/admissions-process.md
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Body, name: body, widget: markdown, i18n: true }
      - name: admissions-requirements
        label: "Admissions: Requirements"
        file: src/content/pages/admissions-requirements.md
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Body, name: body, widget: markdown, i18n: true }
      - name: admissions-tuition-fees
        label: "Admissions: Tuition & Fees"
        file: src/content/pages/admissions-tuition-fees.md
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Body, name: body, widget: markdown, i18n: true }
      - name: gallery
        label: Gallery Page
        file: src/content/pages/gallery.md
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Body, name: body, widget: markdown, i18n: true }
      - name: contact
        label: Contact Page
        file: src/content/pages/contact.md
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Body, name: body, widget: markdown, i18n: true }

  - name: programs
    label: Programs
    folder: src/content/programs
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Summary, name: summary, widget: text, i18n: true }
      - { label: Image, name: image, widget: image, required: false, i18n: true }
      - { label: Display Order, name: order, widget: number, default: 0, i18n: duplicate }
      - { label: Body, name: body, widget: markdown, i18n: true }

  - name: news
    label: News
    folder: src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    i18n: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Date, name: date, widget: datetime, i18n: duplicate }
      - { label: Image, name: image, widget: image, required: false, i18n: true }
      - { label: Summary, name: summary, widget: text, i18n: true }
      - { label: "Video URL (YouTube, Vimeo, etc.)", name: video, widget: string, required: false, i18n: duplicate, hint: "Paste a YouTube or Vimeo link to embed a video on the article page" }
      - { label: Body, name: body, widget: markdown, i18n: true }

  - name: events
    label: Events
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Date, name: date, widget: datetime, i18n: duplicate }
      - { label: End Date, name: endDate, widget: datetime, required: false, i18n: duplicate }
      - { label: Location, name: location, widget: string, required: false, i18n: true }
      - { label: Image, name: image, widget: image, required: false, i18n: true }
      - { label: Summary, name: summary, widget: text, i18n: true }
      - { label: Body, name: body, widget: markdown, i18n: true }
