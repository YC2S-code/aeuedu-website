  home:
    heroTitle: AEU Postgraduate School
    heroSubtitle: Twenty years on this road, in search of a different room of
      people. AEU Postgraduate School (AEUPS) — **leading where it matters,
      building what comes next.**
    heroImage: /images/uploads/heropage_banner2.jpg
    heroCta: Explore the EMBA
    highlightsTitle: Where knowledge is common, judgment is rare. We build the latter.
    highlights:
      - title: FROM KNOWLEDGE TO JUDGMENT
        text: >-
          We are not content with the transfer of knowledge. Every course, every
          case, is built toward one end: to change the quality of your
          decisions.


          ***When most institutions still teach what to know, we train how to decide.***
        image: /images/uploads/pagesmall-banner-01.jpg
      - title: FROM CONNECTION TO CONTINUITY
        text: >-
          Graduation is not an exit — it is the moment you enter ABEA (Alumni
          Network). No roster, no directory. Only those still moving in the same
          direction, with a place to return to and a reason to continue.


          ***What is built here is measured not in a single encounter, but in a long arc.***
        image: /images/uploads/pagesmall-banner-02.jpg
      - title: FROM EDUCATION TO INDUSTRY
        text: >-
          Education is the entry point, not the destination. What is learned
          must ultimately reach enterprise and capital — judgment tested in
          class, proven where decisions are real.


          ***From learning to a system where action and outcome are the only measures.***
        image: /images/uploads/pagesmall-banner-03.jpg
    heroCtaUrl: about-stories
