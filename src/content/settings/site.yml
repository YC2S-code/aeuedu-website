    heroTitle: 亚欧大学国际商学院
    heroSubtitle: 我们志在成为东盟地区最具影响力的**高端管理教育与商业生态平台**。以高等**教育为纽带**,**连接理念同行的企业与人才,共创未来。**
    heroImage: /images/uploads/heropage_banner2.jpg
    heroCta: 了解 EMBA 课程
    highlightsTitle: 知者众，断者寡，我们造就的是后者。
    highlights:
      - title: 01 从知识到判断
        text: |-
          我们不满足于知识的传递。每一门课程、每一个案例，都以「改变决策质量」为终极目标。

          ***当大多数机构仍在传授知识时，我们选择让知识转化为判断力。***
        image: /images/uploads/pagesmall-banner-01.jpg
      - title: 02 从链接到延续
        text: |-
          毕业不是终点，而是加入ABEA （校友网络圈子）的真正起点。这里没有名录，只有仍在同行的人——有处可去，有时可续。

          ***此中往来，不计一时之交，而图长久之势。***
        image: /images/uploads/pagesmall-banner-02.jpg
      - title: 03 从教育到产业
        text: |-
          教育是入口，不是终点。所学之处，终要延伸至企业运营与资本对接——课堂所验之断，见于真实决策之局。

          ***以教育为入口，延伸至商业行动与结果的实战系统。***
        image: /images/uploads/pagesmall-banner-03.jpg
    heroCtaUrl: about-stories
